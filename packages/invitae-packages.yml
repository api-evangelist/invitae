note: >-
  Invitae publishes NO first-party client library for any API. One package exists under
  the company's own npm scope — @invitae/pdfjs — but it is a custom build of Mozilla's
  PDF.js used by Invitae's own web application, not an API SDK. Every "bioinformatics"
  repository in the github.com/invitae organization (hgvs, bioutils, uta, SpliceAI,
  needlestack, VarDictJava, pangolin) is a FORK of an upstream project
  (biocommons/*, Illumina/SpliceAI, IARCbioinfo/needlestack, AstraZeneca-NGS/VarDictJava,
  broadinstitute/pangolin) — verified via the GitHub API `fork`/`parent` fields — so the
  PyPI/Maven artifacts for those names belong to their upstream owners, not to Invitae.
  Because there is no API client library, apis.yml carries a Packages pointer but
  deliberately does NOT carry an SDKs pointer.
