actions:
  apisYmlUpdated: true
  specsHarvested: 0
  reason: |
    No public developer portal, FHIR CapabilityStatement, SMART configuration, or
    downloadable OpenAPI exists to harvest. Bootstrap captures honest identity plus
    the gated Epic-Aura/HL7 EHR-integration posture in the United States home
    market. apis[] is empty because no publicly documented API surface exists;
    nothing was fabricated.
