aid: invitae
name: Invitae
review:
  question: Does Invitae expose a documented public developer API, FHIR CapabilityStatement, or downloadable OpenAPI?
  answer: false
  date: '2026-07-24'
  reviewer: API Evangelist
  homeMarket: United States
findings:
  summary: |
    Invitae (now Labcorp Invitae, after Labcorp acquired select Invitae assets in
    2024) is a United States medical-genetics company. It does NOT publish a
    self-serve public developer API. Candidate developer/API hosts were probed and
    none resolve or serve a spec: developer.invitae.com and docs.invitae.com and
    fhir.invitae.com do not resolve (connection failure), api.invitae.com returns
    404 at the root and for /metadata, /openapi.json, and
    /.well-known/smart-configuration, and www.invitae.com/developers,
    www.invitae.com/api, and www.invitae.com/interoperability all return 404. No
    FHIR CapabilityStatement (metadata) and no SMART-on-FHIR .well-known
    configuration were served. No downloadable OpenAPI/Swagger was found. The
    company's public GitHub organization (github.com/invitae, ~46 public repos) is
    genuine but holds bioinformatics tooling (hgvs, bioutils, UTA, SpliceAI,
    VarDictJava, needlestack), not API specifications or SDKs.
    Integration is enterprise and partner-gated: genetic test orders and results
    are delivered into the EHR through Epic-certified interfaces and Epic Aura
    (Orders and Results Anywhere Network) and traditional HL7 order/result feeds,
    coordinated by a dedicated EHR integration team, rather than through a
    documented public FHIR or REST API. This is an honest gated-integration result,
    not a fabricated surface.
  developerPortal:
    url: ""
    confirmed: false
    note: No first-party developer portal exists. Provider-facing surface is a clinical ordering portal at https://www.invitae.com/us/providers (HTTP 200), not a developer/API portal.
  fhirCapabilityStatement:
    present: false
    version: null
    resources: []
    note: No <base>/metadata CapabilityStatement and no /.well-known/smart-configuration served on any probed host.
  downloadableSpecs:
    count: 0
    provenance: []
    note: No OpenAPI/Swagger or FHIR metadata JSON harvested; nothing served on api.invitae.com or the docs/developer hosts (which do not resolve).
  authModel:
    scheme: none-public
    note: No public auth surface. No SMART-on-FHIR, OAuth2 client-credentials, API key, or mTLS scheme is documented publicly. Integration credentials are provisioned through partner/EHR-integration engagements.
    smartOnFhirScopes: []
  standardsConformance:
    usCore: false
    ukCore: false
    auCore: false
    daVinci: false
    carin: false
    note: No published implementation-guide conformance. Interoperability is via Epic Aura / HL7 order-result interfaces arranged per customer.
  access:
    model: gated
    selfServe: false
    note: Partner/enterprise integration engagement required; no public sandbox or self-serve API signup.
  transports:
    - protocol: EHR Integration (Epic Aura / HL7)
      scheme: partner-gated
      documented: false
      note: Orders and results exchanged with EHRs via Epic-certified interfaces, Epic Aura, and HL7 feeds. Not a publicly documented API transport.
    - protocol: REST
      scheme: https
      documented: false
      note: api.invitae.com resolves but returns 404 at the root and for all probed spec paths; no public REST API is documented.
    - protocol: FHIR
      scheme: https
      documented: false
      note: No FHIR base, CapabilityStatement, or SMART configuration is served on any probed host.
