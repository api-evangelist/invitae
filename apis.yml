name: Invitae
kind: company
description: >-
  Invitae — operated as Labcorp Invitae / Labcorp Genetics since Labcorp acquired select
  Invitae assets out of the company's 2024 Chapter 11 — is a United States medical
  genetics and healthcare-technology company providing clinical-grade hereditary and
  somatic genetic testing across oncology, women's health, cardiology, neurology,
  pediatrics, and rare disease. Its laboratory is CLIA-certified and CAP-accredited, and
  it publishes a HIPAA Notice of Privacy Practices and state laboratory licensure.
  Clinicians order tests and receive results through a web portal with licensed genetic
  counseling and the Gia digital assistant. Invitae publishes no API: contract discovery
  across every Invitae host found no developer portal, no OpenAPI, no GraphQL endpoint,
  no MCP server, no A2A agent card, no FHIR CapabilityStatement, no SMART-on-FHIR
  configuration, no webhooks, no client SDK and no /.well-known document. api.invitae.com
  resolves but returns a blanket nginx 403 for every path, and the developer, docs and
  fhir subdomains do not resolve at all. The company's public GitHub organization is
  genuine but consists of forks of upstream bioinformatics projects, not first-party
  specifications or libraries.
