name: Invitae
kind: company
description: >-
  Invitae (now Labcorp Invitae, following Labcorp's 2024 acquisition of select Invitae
  assets) is a United States medical genetics and healthcare-technology company that
  provides clinical-grade hereditary and somatic genetic testing across oncology,
  women's health, cardiology, neurology, pediatrics, and rare disease. It offers
  providers an online ordering portal, licensed genetic counseling, and the Gia digital
  assistant, and returns results into clinician workflows. Invitae's integration posture
  is enterprise and partner-gated rather than a self-serve public developer API: genetic
  test orders and results reach the electronic health record through Epic-certified
  interfaces and Epic Aura (Orders and Results Anywhere Network) and traditional HL7
  order/result feeds delivered by a dedicated EHR integration team. As of this review no
  public developer portal, FHIR CapabilityStatement, SMART-on-FHIR configuration, or
  downloadable OpenAPI is published; programmatic access is arranged through a
  partnership/integration engagement in its United States home market.
